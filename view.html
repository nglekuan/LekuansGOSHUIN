<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神社巡り | 御朱印收藏分享</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

  :root{
    --washi:#f0ede3;
    --washi-deep:#e2dccb;
    --sumi:#242a2e;
    --sumi-soft:#454e52;
    --shu:#2c4a6e;
    --shu-deep:#1f3650;
    --shu-glow:#3d6690;
    --gold:#7d8f6a;
    --line:#c3c4b4;
    --paper-shadow: rgba(30,40,50,0.18);
    --card:#f7f4ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--washi);
    color:var(--sumi);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.6;
  }
  .app{max-width:960px; margin:0 auto; padding:0 20px 90px;}

  header.hero{
    display:flex; align-items:center; justify-content:space-between;
    padding:40px 4px 30px;
    border-bottom:1px solid var(--line);
    margin-bottom:30px;
    gap:24px;
  }
  .hero-title-block{display:flex; align-items:flex-end; gap:20px;}
  .kanji-vert{
    writing-mode: vertical-rl;
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:1.9rem;
    letter-spacing:0.28em;
    color:var(--sumi);
    line-height:1.15;
  }
  .hero-en{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.64rem;
    letter-spacing:0.3em;
    color:var(--sumi-soft);
    text-transform:uppercase;
    margin-top:4px;
  }
  .hero-sub{
    font-size:0.86rem;
    color:var(--sumi-soft);
    line-height:1.8;
    max-width:240px;
    border-left:1px solid var(--line);
    padding-left:16px;
  }
  .hero-scene{flex-shrink:0; width:150px; max-width:32vw;}
  .hero-scene svg{width:100%; height:auto; display:block;}

  @media (max-width:600px){
    header.hero{padding-top:24px;}
    .kanji-vert{font-size:1.5rem;}
    .hero-scene{width:110px;}
  }

  .state-box{padding:60px 20px; text-align:center; color:var(--sumi-soft);}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:30px;}
  .stat{background:var(--card); padding:16px 14px; display:flex; flex-direction:column; gap:6px;}
  .stat-label{font-size:0.62rem; letter-spacing:0.1em; color:var(--sumi-soft);}
  .stat-value{font-family:'Shippori Mincho', serif; font-size:1.6rem; font-weight:700; color:var(--shu-deep);}
  .stat-value small{font-size:0.78rem; font-weight:500; color:var(--sumi-soft); margin-left:2px;}
  .stat-split{display:flex; align-items:center; gap:12px;}
  .stat-split-item{display:flex; flex-direction:column;}
  .stat-split-value{font-family:'Shippori Mincho', serif; font-size:1.3rem; font-weight:700; color:var(--shu-deep); line-height:1.2;}
  .stat-split-label{font-size:0.62rem; color:var(--sumi-soft);}
  .stat-split-divider{width:1px; align-self:stretch; background:var(--line); opacity:0.7;}
  @media (max-width:600px){ .stats{grid-template-columns:repeat(2,1fr);} }

  .tab-nav{display:flex; gap:2px; margin-bottom:26px; border-bottom:1px solid var(--line);}
  .tab-btn{
    font-family:'Zen Old Mincho', serif; font-size:0.92rem; font-weight:600; letter-spacing:0.08em;
    background:none; border:none; padding:10px 6px 13px; margin-right:26px;
    color:var(--sumi-soft); cursor:pointer; position:relative;
    display:flex; align-items:baseline; gap:8px;
  }
  .tab-btn .tab-count{font-family:'Zen Kaku Gothic New', sans-serif; font-size:0.68rem; font-weight:400; color:var(--sumi-soft);}
  .tab-btn::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:transparent; transition:background 0.16s ease;}
  .tab-btn.active{color:var(--shu-deep);}
  .tab-btn.active::after{background:var(--shu);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;}
  .section-head h2{
    font-family:'Zen Old Mincho', serif; font-size:1rem; font-weight:600; letter-spacing:0.06em; margin:0;
    display:flex; align-items:center; gap:9px;
  }
  .section-head h2::before{content:''; display:inline-block; width:5px; height:5px; background:var(--shu); border-radius:50%;}
  .section-head .count{font-family:'Zen Kaku Gothic New',sans-serif; font-weight:400; font-size:0.76rem; color:var(--sumi-soft);}

  .toolbar{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .toolbar input[type="text"], .toolbar select{
    font-family:'Zen Kaku Gothic New', sans-serif; background:var(--card); border:1px solid var(--line);
    padding:8px 12px; font-size:0.82rem; color:var(--sumi); border-radius:2px;
  }
  .toolbar input[type="text"]{flex:1; min-width:160px;}

  .books-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:16px; justify-items:center;}
  .book-card{
    width:100%; aspect-ratio:0.68; max-width:210px;
    border-radius:3px; padding:16px 14px; position:relative;
    display:flex; flex-direction:column; justify-content:space-between;
    box-shadow:3px 4px 0 var(--paper-shadow);
    border:1px solid rgba(0,0,0,0.06);
    overflow:hidden;
    cursor:pointer;
  }
  .book-cover{
    position:absolute; inset:0; border-radius:3px;
    background-size:cover; background-position:center;
  }
  .book-cover.has-photo::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,14,8,0.15) 0%, rgba(20,14,8,0.55) 100%);
  }
  .book-card > *:not(.book-cover){position:relative; z-index:1;}
  .book-expand{
    position:absolute; top:10px; left:10px; z-index:2;
    width:26px; height:26px; border-radius:50%; border:none;
    background:rgba(20,20,20,0.5); color:#faf3e4; font-size:0.85rem;
    display:flex; align-items:center; justify-content:center; cursor:zoom-in;
    padding:0;
  }
  .book-expand:hover{background:rgba(20,20,20,0.75);}
  .mangan-badge{
    position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%;
    background:rgba(44,74,110,0.92); color:#faf3e4;
    display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:0.58rem; letter-spacing:0.04em;
    box-shadow:1px 2px 4px rgba(0,0,0,0.3); border:1.5px solid rgba(250,243,228,0.75);
    transform:rotate(-8deg); z-index:2;
  }
  .book-card .book-title{
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:1rem; line-height:1.5;
    writing-mode:vertical-rl; flex:1; min-height:0; color:#faf3e4; text-shadow:0 1px 2px rgba(0,0,0,0.4);
  }
  .book-card .book-meta{display:flex; justify-content:space-between; align-items:flex-end; color:#faf3e4;}
  .book-card .book-meta-col{display:flex; flex-direction:column; gap:2px;}
  .book-card .book-meta-col.right{align-items:flex-end;}
  .book-card .book-count{font-size:1.35rem; font-family:'Shippori Mincho', serif; font-weight:700;}
  .book-card .book-count small{font-size:0.65rem; font-weight:400; opacity:0.85;}
  .book-card .book-tag{font-size:0.62rem; letter-spacing:0.06em; opacity:0.85;}
  .book-card .book-location{font-size:0.58rem; opacity:0.75;}

  .list-row{
    background:var(--card); display:flex; align-items:center; gap:14px;
    padding:12px 14px; border-bottom:1px solid var(--washi-deep);
    cursor:default;
  }
  .list-row.has-photo{cursor:pointer;}
  .list-row:hover.has-photo{background:#fff8ea;}
  .list-thumb{
    width:58px; height:74px; flex-shrink:0; background:linear-gradient(135deg,#efe4cc,#e3d3ac);
    border-radius:2px; overflow:hidden; display:flex; align-items:center; justify-content:center;
  }
  .list-thumb.landscape{width:96px; height:64px;}
  .list-thumb img{width:100%; height:100%; object-fit:cover;}
  .list-thumb .mini-mark{color:var(--shu-deep); opacity:0.3; font-size:1.4rem; font-family:'Shippori Mincho',serif;}
  .list-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px;}
  .list-name{font-family:'Shippori Mincho', serif; font-weight:600; font-size:0.94rem;}
  .proxy-tag{
    display:inline-block; margin-left:8px; padding:1px 7px; font-size:0.6rem; font-weight:500;
    color:var(--sumi-soft); border:1px solid var(--line); border-radius:10px; vertical-align:middle;
  }
  .list-meta{display:flex; flex-wrap:wrap; align-items:center; gap:0 10px; font-size:0.74rem; color:var(--sumi-soft);}
  .list-meta span:not(:last-child)::after{content:'・'; margin-left:10px; color:var(--line);}
  .list-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
  .tag-pill{
    font-size:0.62rem; padding:2px 8px; border-radius:10px;
    background:rgba(44,74,110,0.08); color:var(--shu-deep); border:1px solid rgba(44,74,110,0.18);
  }

  .map-progress{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:0.78rem; color:var(--sumi-soft);
    background:var(--card); border:1px solid var(--line); padding:6px 14px; border-radius:14px;
  }
  .map-progress strong{color:var(--shu-deep); font-weight:700;}
  .map-wrap{display:grid; grid-template-columns:minmax(260px,420px) 1fr; gap:24px; align-items:flex-start;}
  @media (max-width:760px){ .map-wrap{grid-template-columns:1fr;} }
  .map-svg-col{background:var(--card); border:1px solid var(--line); border-radius:3px; padding:14px 14px 10px;}
  .map-credit{font-size:0.6rem; color:var(--sumi-soft); opacity:0.65; text-align:right; margin-top:8px;}
  .map-credit a{color:inherit;}
  .map-credit:empty{display:none;}
  .inset-divider{stroke:var(--sumi-soft); stroke-width:0.6; opacity:0.5;}
  .inset-frame{fill:none; stroke:var(--sumi-soft); stroke-width:0.5; stroke-dasharray:2,1.5; opacity:0.5;}
  .region-label{font-family:'Zen Kaku Gothic New', sans-serif; font-size:5.5px; font-weight:700; letter-spacing:0.02em; pointer-events:none;}
  .selected-pref-label-bg{fill:var(--sumi); opacity:0.88; pointer-events:none;}
  .selected-pref-pin{fill:var(--shu); stroke:#faf3e4; stroke-width:0.4; pointer-events:none;}
  .selected-pref-label-text{font-family:'Shippori Mincho', serif; font-size:6px; font-weight:700; fill:#faf3e4; pointer-events:none;}
  .pref-shape{cursor:pointer; transition:fill 0.15s ease, fill-opacity 0.15s ease, stroke-width 0.12s ease, filter 0.12s ease;}
  .pref-shape:hover{filter:brightness(1.08);}
  #japanMap{width:100%; height:auto; display:block;}
  .pref-tile{cursor:pointer;}
  .tile-base{stroke:var(--washi); stroke-width:2; transition:fill 0.15s ease, fill-opacity 0.15s ease;}
  .pref-tile:hover .tile-base{filter:brightness(1.08);}
  .pref-tile.selected .tile-base{stroke:var(--sumi); stroke-width:2.5;}
  .tile-label{font-family:'Zen Kaku Gothic New', sans-serif; font-size:7.5px; font-weight:500; text-anchor:middle; dominant-baseline:central; pointer-events:none;}

  .map-side{background:var(--card); border:1px solid var(--line); border-radius:3px; padding:20px 22px; min-height:180px;}
  .map-side-empty{color:var(--sumi-soft); font-size:0.85rem; line-height:1.9; text-align:center; padding:36px 10px;}
  .map-side-title{font-family:'Shippori Mincho', serif; font-weight:700; font-size:1.15rem; margin-bottom:4px;}
  .map-side-count{font-size:0.76rem; color:var(--sumi-soft); margin-bottom:16px;}
  .map-side-list{display:flex; flex-direction:column; gap:9px;}
  .msi-item{
    display:flex; align-items:center; gap:12px; padding:9px 11px;
    background:var(--washi); border:1px solid var(--line); border-radius:2px;
  }
  .msi-item.has-photo{cursor:pointer;}
  .msi-item .msi-name{font-family:'Shippori Mincho', serif; font-size:0.88rem; font-weight:600;}
  .msi-item .msi-date{font-size:0.7rem; color:var(--sumi-soft);}
  .msi-thumb{
    width:38px; height:50px; flex-shrink:0; border-radius:2px; overflow:hidden;
    background:linear-gradient(135deg,#efe4cc,#e3d3ac); display:flex; align-items:center; justify-content:center;
  }
  .msi-thumb img{width:100%; height:100%; object-fit:cover;}
  .msi-thumb-mark{color:var(--shu-deep); opacity:0.35; font-size:0.95rem; font-family:'Shippori Mincho',serif;}

  .empty-note{color:var(--sumi-soft); font-size:0.85rem; padding:20px 4px;}

  footer{text-align:center; font-size:0.7rem; color:var(--sumi-soft); opacity:0.7; margin-top:50px;}

  .lightbox{
    display:none; position:fixed; inset:0; z-index:100; background:rgba(15,15,15,0.92);
    align-items:center; justify-content:center; padding:24px; cursor:zoom-out;
  }
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; object-fit:contain; box-shadow:0 4px 30px rgba(0,0,0,0.5); border-radius:2px;}
</style>
</head>
<body>

<div class="app">
  <header class="hero">
    <div class="hero-title-block">
      <span class="kanji-vert">神社巡り</span>
      <div>
        <div class="hero-en">Goshuin Collection Log</div>
        <div class="hero-sub">記錄每一次參拜、每一枚墨跡與朱印，留下走過的社寺足跡。</div>
      </div>
    </div>
    <div class="hero-scene" aria-hidden="true">
      <svg viewBox="0 0 260 150" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,108 Q30,100 60,108 T120,108 T180,108 T260,108" fill="none" stroke="var(--line)" stroke-width="1.5" opacity="0.5"/>

        <g stroke="var(--shu)" stroke-width="4" stroke-linecap="round" fill="none">
          <line x1="196" y1="66" x2="192" y2="112"/>
          <line x1="234" y1="66" x2="238" y2="112"/>
          <line x1="186" y1="66" x2="244" y2="66"/>
          <line x1="182" y1="76" x2="248" y2="76"/>
        </g>
      </svg>
    </div>
  </header>

  <div id="stateBox" class="state-box">正在載入收藏內容…</div>

  <div id="content" style="display:none;">
    <div class="stats" id="statsRow"></div>

    <div class="tab-nav">
      <button class="tab-btn active" data-tab="booksTab">朱印帳 <span class="tab-count" id="tabBookCount"></span></button>
      <button class="tab-btn" data-tab="recordsTab">御朱印 <span class="tab-count" id="tabRecordCount"></span></button>
      <button class="tab-btn" data-tab="mapTab">巡禮地圖</button>
    </div>

    <div class="tab-panel active" id="booksTab">
      <div class="section-head"><h2>朱印帳</h2></div>
      <div class="books-grid" id="booksGrid"></div>
    </div>

    <div class="tab-panel" id="recordsTab">
      <div class="section-head"><h2>御朱印 <span class="count" id="recordsCount"></span></h2></div>
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="搜尋寺社名稱、地點…">
        <select id="bookFilter"><option value="all">所有朱印帳</option></select>
      </div>
      <div id="recordsList"></div>
    </div>

    <div class="tab-panel" id="mapTab">
      <div class="section-head">
        <h2>巡禮地圖</h2>
        <span class="map-progress" id="mapProgress"></span>
      </div>
      <div class="map-wrap">
        <div class="map-svg-col"><div id="japanMap"></div><div class="map-credit" id="mapCredit"></div></div>
        <div class="map-side" id="mapSide"><div class="map-side-empty">點選地圖上的色塊，查看該地的參拜記錄。</div></div>
      </div>
    </div>
  </div>

  <footer>由「神社巡り」App 產生的公開分享頁面・唯讀</footer>
</div>

<div id="lightbox" class="lightbox"><img id="lightboxImg" src="" alt=""></div>

  const PREFECTURE_NAMES = TILE_GRID.map(g=>g.name);

  const REGION_OF_CODE = (()=>{
    const defs = [
      ['hokkaido',['01']],
      ['tohoku',['02','03','04','05','06','07']],
      ['kanto',['08','09','10','11','12','13','14']],
      ['chubu',['15','16','17','18','19','20','21','22','23']],
      ['kansai',['24','25','26','27','28','29','30']],
      ['chugoku',['31','32','33','34','35']],
      ['shikoku',['36','37','38','39']],
      ['kyushu',['40','41','42','43','44','45','46']],
      ['okinawa',['47']]
    ];
    const map = {};
    defs.forEach(function(pair){ pair[1].forEach(function(c){ map[c]=pair[0]; }); });
    return map;
  })();
  const REGION_COLORS = {
    hokkaido:'#926252', chubu:'#928852', tohoku:'#789252', shikoku:'#529252',
    kanto:'#6d5292', kyushu:'#885292', chugoku:'#925282', kansai:'#925268', okinawa:'#529278'
  };
  const PREFECTURE_COLOR_OVERRIDES = {
    '47':'#0f1e17'
  };
  const PREFECTURE_OPACITY_OVERRIDES = { '47':1 };
  let REAL_PREF_NAMES = {};
  let mapMode = 'tile';

  function renderRealMap(geojson){
    const container = $('japanMap');
    const features = geojson.features || [];
    if(features.length === 0) return false;

    // simple equirectangular-ish projection sized to Japan's lat/lng extent,
    // with longitude scaled by cos(mean latitude) to avoid east-west stretching
    let minLng=Infinity, maxLng=-Infinity, minLat=Infinity, maxLat=-Infinity;
    function scanCoords(coords, depth){
      if(depth === 0){
        const [lng,lat] = coords;
        if(lng<minLng) minLng=lng; if(lng>maxLng) maxLng=lng;
        if(lat<minLat) minLat=lat; if(lat>maxLat) maxLat=lat;
      } else {
        coords.forEach(c => scanCoords(c, depth-1));
      }
    }
    features.forEach(f=>{
      const depth = f.geometry.type === 'MultiPolygon' ? 3 : 2;
      scanCoords(f.geometry.coordinates, depth);
    });

    const meanLat = (minLat+maxLat)/2 * Math.PI/180;
    const rawScale = 300 / ((maxLng-minLng) * Math.cos(meanLat));
    function project([lng,lat]){
      const x = (lng-minLng) * Math.cos(meanLat) * rawScale;
      const y = (maxLat-lat) * rawScale;
      return [x,y];
    }

    // project every feature into raw polygon-of-rings-of-[x,y] arrays first,
    // so Hokkaido/Okinawa can be repositioned before we compute the final viewBox
    const projected = features.map(f=>{
      const props = f.properties || {};
      const idNum = props.id;
      if(idNum == null) return null;
      const code = String(idNum).padStart(2,'0');
      let polys; // array of polygons, each an array of rings, each an array of [x,y]
      if(f.geometry.type === 'Polygon'){
        polys = [f.geometry.coordinates.map(ring => ring.map(project))];
      } else if(f.geometry.type === 'MultiPolygon'){
        polys = f.geometry.coordinates.map(poly => poly.map(ring => ring.map(project)));
      } else return null;
      return { code, name: props.nam_ja||'', polys };
    }).filter(Boolean);

    // Some prefectures (notably Tokyo, which administers the Izu and
    // Ogasawara Islands hundreds of km out in the Pacific) include tiny
    // remote exclaves that would otherwise blow out the map's bounding box.
    // Keep only polygon parts reasonably close to each feature's main landmass.
    function polyArea(ring){
      let a = 0;
      for(let i=0;i<ring.length;i++){
        const [x1,y1] = ring[i], [x2,y2] = ring[(i+1)%ring.length];
        a += x1*y2 - x2*y1;
      }
      return Math.abs(a/2);
    }
    function polyBounds(poly){
      let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
      poly.forEach(ring => ring.forEach(([x,y])=>{
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
      }));
      return {cx:(x0+x1)/2, cy:(y0+y1)/2, diag:Math.hypot(x1-x0,y1-y0)};
    }
    // Nagasaki, Kagoshima and Okinawa are genuinely made up of many
    // scattered islands spread across real distances — that's normal for
    // them, unlike Tokyo's Ogasawara exclave. Skip the exclave filter there
    // so we don't strip out islands that are actually part of the prefecture.
    const EXCLAVE_FILTER_EXEMPT = ['42','46','47'];
    projected.forEach(it=>{
      if(it.polys.length <= 1) return;
      if(EXCLAVE_FILTER_EXEMPT.includes(it.code)) return;
      const areas = it.polys.map(poly => poly.reduce((s,ring)=> s+polyArea(ring), 0));
      const mainIdx = areas.indexOf(Math.max(...areas));
      const mainBounds = polyBounds(it.polys[mainIdx]);
      const threshold = Math.max(mainBounds.diag * 8, 15);
      it.polys = it.polys.filter((poly,i)=>{
        if(i === mainIdx) return true;
        const b = polyBounds(poly);
        return Math.hypot(b.cx-mainBounds.cx, b.cy-mainBounds.cy) <= threshold;
      });
    });

    function bboxOf(items){
      let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
      items.forEach(it => it.polys.forEach(poly => poly.forEach(ring => ring.forEach(([x,y])=>{
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
      }))));
      return {x0,x1,y0,y1,w:x1-x0,h:y1-y0};
    }
    function transformItems(items, fn){
      items.forEach(it => it.polys.forEach(poly => poly.forEach(ring => {
        for(let i=0;i<ring.length;i++) ring[i] = fn(ring[i]);
      })));
    }

    // Hokkaido is left at its real projected position (part of "mainland") —
    // the actual geographic gap to Tohoku isn't dramatic at this scale, so no
    // artificial repositioning is needed and it avoids alignment bugs entirely.
    const mainland = projected.filter(it => it.code!=='47');
    const okinawa = projected.filter(it => it.code==='47');
    const mBox = bboxOf(mainland);

    // Okinawa is placed as a clearly separate inset box, bottom-right corner —
    // not geographically positioned, matching how most Japan reference maps
    // show it (too far from the mainland to place accurately at this scale).
    let okinawaInsetBox = null;
    if(okinawa.length){
      const oBox = bboxOf(okinawa);
      // scaled up well beyond true relative size — insets are explicitly
      // "not to scale" (see divider line) and Okinawa's real land area is
      // tiny, so a literal-scale rendering is nearly invisible at map size
      const s = 1.3;
      const insetW = oBox.w*s, insetH = oBox.h*s;
      const margin = 2;
      const targetX1 = mBox.x1;
      const targetY1 = mBox.y1 + insetH*0.12 + 4;
      transformItems(okinawa, ([x,y]) => [
        targetX1 - (oBox.x1-x)*s,
        targetY1 - (oBox.y1-y)*s
      ]);
      okinawaInsetBox = {
        x0: targetX1 - insetW - margin, y0: targetY1 - insetH - margin,
        x1: targetX1 + margin, y1: targetY1 + margin
      };
    }

    // ---- region name labels ----
    // Two placement modes:
    //  - "anchor": pinned relative to one specific prefecture (as requested),
    //    e.g. chubu sits directly above Toyama
    //  - "auto": median-centroid based, for regions where that already reads fine
    const REGION_LABEL_DEFS = [
      {slug:'hokkaido', text:'北海道地方', mode:'auto'},
      {slug:'tohoku', text:'東北地方', mode:'auto', extraMargin:4},
      {slug:'kanto', text:'関東地方', mode:'auto'},
      {slug:'chubu', text:'中部地方', mode:'anchor', anchorCode:'16', dir:'up', dy:-5},   // 富山 toyama
      {slug:'kansai', text:'近畿地方', mode:'anchor', anchorCode:'30', dir:'down', dx:6}, // 和歌山 wakayama
      {slug:'chugoku', text:'中国地方', mode:'anchor', anchorCode:'32', dir:'up'},  // 島根 shimane
      {slug:'shikoku', text:'四国地方', mode:'anchor', anchorCode:'39', dir:'down', dx:6},// 高知 kochi
      {slug:'kyushu', text:'九州地方', mode:'anchor', anchorCode:'45', dir:'downright'},// 宮崎 miyazaki
      {slug:'okinawa', text:'沖縄地方', mode:'auto'}
    ];
    const LABEL_FONT_SIZE = 5.5;
    function median(nums){
      const s = nums.slice().sort((a,b)=>a-b);
      const mid = Math.floor(s.length/2);
      return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
    }
    function prefCentroid(it){
      const b = bboxOf([it]);
      return [(b.x0+b.x1)/2, (b.y0+b.y1)/2];
    }
    // for UI anchor points (selection label/pin) we want the dominant
    // mainland landmass specifically — not a bbox center across every part,
    // which remote-but-real islands (Izu/Ogasawara for Tokyo, Amami for
    // Kagoshima) would drag away from where the prefecture actually reads
    // visually on the map
    function mainlandCentroid(it){
      if(it.polys.length <= 1) return prefCentroid(it);
      let bestPoly = it.polys[0], bestArea = -1;
      it.polys.forEach(poly=>{
        const area = poly.reduce((s,ring)=> s+polyArea(ring), 0);
        if(area > bestArea){ bestArea = area; bestPoly = poly; }
      });
      const b = polyBounds(bestPoly);
      return [b.cx, b.cy];
    }
    const mapMidX = mBox.x0 + mBox.w/2;
    const regionLabels = [];
    REGION_LABEL_DEFS.forEach(({slug,text,mode,anchorCode,dir,extraMargin,dx,dy})=>{
      const members = projected.filter(it => REGION_OF_CODE[it.code]===slug);
      if(members.length===0) return;
      const textWidth = text.length * LABEL_FONT_SIZE * 1.05;
      const color = REGION_COLORS[slug];
      const ox = dx||0, oy = dy||0;

      if(mode === 'anchor'){
        const anchorItem = projected.find(it => it.code===anchorCode);
        if(!anchorItem){ return; }
        const [acx, acy] = prefCentroid(anchorItem);
        const gap = 4;
        if(dir==='up' || dir==='down'){
          regionLabels.push({
            text, color,
            x: acx+ox, y: (dir==='up' ? acy-gap-LABEL_FONT_SIZE : acy+gap+LABEL_FONT_SIZE)+oy,
            anchor: 'middle', onRight: acx>=mapMidX, textWidth, fixed:true
          });
        } else if(dir==='downright' || dir==='downleft' || dir==='upright' || dir==='upleft'){
          const goRight = dir.endsWith('right');
          const goDown = dir.startsWith('down');
          regionLabels.push({
            text, color,
            x: (goRight ? acx+gap : acx-gap)+ox,
            y: (goDown ? acy+gap+LABEL_FONT_SIZE : acy-gap-LABEL_FONT_SIZE)+oy,
            anchor: goRight ? 'start' : 'end',
            onRight: goRight, textWidth, fixed:true
          });
        } else {
          regionLabels.push({
            text, color,
            x: (dir==='right' ? acx+gap : acx-gap)+ox,
            y: acy+oy,
            anchor: dir==='right' ? 'start' : 'end',
            onRight: dir==='right', textWidth, fixed:true
          });
        }
        return;
      }

      // auto mode: median-centroid based
      const centroids = members.map(prefCentroid);
      const cx = median(centroids.map(c=>c[0]));
      const cy = median(centroids.map(c=>c[1]));
      const onRight = cx >= mapMidX;
      const margin = 12 + (extraMargin||0);
      regionLabels.push({
        text, color,
        x: onRight ? cx+margin : cx-margin,
        y: cy,
        anchor: onRight ? 'start' : 'end',
        onRight, textWidth, fixed:false
      });
    });
    // simple vertical collision avoidance within each side (left/right) —
    // only applied to "auto" labels, since "anchor" labels are intentionally
    // pinned to a specific spot and shouldn't be pushed around
    const minLineGap = LABEL_FONT_SIZE * 3.2;
    ['left','right'].forEach(side=>{
      const group = regionLabels.filter(l => !l.fixed && (side==='right') === l.onRight).sort((a,b)=>a.y-b.y);
      for(let i=1;i<group.length;i++){
        if(group[i].y - group[i-1].y < minLineGap){
          group[i].y = group[i-1].y + minLineGap;
        }
      }
    });

    const finalBox = bboxOf(projected);
    // expand the viewBox to fully contain every label's estimated extent,
    // so labels for edge regions never get clipped off the visible area
    let labelMinX = finalBox.x0, labelMaxX = finalBox.x1;
    let labelMinY = finalBox.y0, labelMaxY = finalBox.y1;
    regionLabels.forEach(lb=>{
      let left, right;
      if(lb.anchor === 'middle'){
        left = lb.x - lb.textWidth/2;
        right = lb.x + lb.textWidth/2;
      } else {
        left = lb.onRight ? lb.x : lb.x - lb.textWidth;
        right = lb.onRight ? lb.x + lb.textWidth : lb.x;
      }
      if(left < labelMinX) labelMinX = left;
      if(right > labelMaxX) labelMaxX = right;
      if(lb.y - LABEL_FONT_SIZE < labelMinY) labelMinY = lb.y - LABEL_FONT_SIZE;
      if(lb.y + LABEL_FONT_SIZE > labelMaxY) labelMaxY = lb.y + LABEL_FONT_SIZE;
    });
    const pad = 4;
    const vbX = labelMinX-pad, vbY = labelMinY-pad;
    const vbW = (labelMaxX-labelMinX)+pad*2, vbH = (labelMaxY-labelMinY)+pad*2;

    function ringToPath(ring){
      return ring.map((pt,i)=> (i===0?'M':'L') + pt[0].toFixed(1) + ',' + pt[1].toFixed(1)).join(' ') + 'Z';
    }
    function polysToPath(polys){
      return polys.map(poly => poly.map(ringToPath).join(' ')).join(' ');
    }

    let markup = `<svg viewBox="${vbX.toFixed(1)} ${vbY.toFixed(1)} ${vbW.toFixed(1)} ${vbH.toFixed(1)}" xmlns="http://www.w3.org/2000/svg">`;
    let shapeCount = 0;
    projected.forEach(it=>{
      const d = polysToPath(it.polys);
      if(!d) return;
      shapeCount++;
      const c = mainlandCentroid(it);
      REAL_PREF_NAMES[it.code] = it.name;
      markup += `<path class="pref-shape" data-code="${it.code}" data-name="${it.name}" data-cx="${c[0].toFixed(1)}" data-cy="${c[1].toFixed(1)}" d="${d}" fill="var(--washi-deep)" fill-opacity="0.6" stroke="var(--washi)" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round" fill-rule="nonzero"><title>${it.name}</title></path>`;
    });
    if(okinawaInsetBox){
      const b = okinawaInsetBox;
      // diagonal divider marking Okinawa as a separate, not-to-scale inset
      markup += `<line x1="${(b.x0-6).toFixed(1)}" y1="${(b.y0-2).toFixed(1)}" x2="${(b.x0+6).toFixed(1)}" y2="${(b.y0-14).toFixed(1)}" class="inset-divider"/>`;
      markup += `<rect x="${b.x0.toFixed(1)}" y="${b.y0.toFixed(1)}" width="${(b.x1-b.x0).toFixed(1)}" height="${(b.y1-b.y0).toFixed(1)}" class="inset-frame"/>`;
    }
    regionLabels.forEach(lb=>{
      markup += `<text x="${lb.x.toFixed(1)}" y="${lb.y.toFixed(1)}" text-anchor="${lb.anchor}" class="region-label" fill="${lb.color}" dominant-baseline="middle">${lb.text}</text>`;
    });
    markup += `<g id="selectedPrefLabelGroup" style="display:none;">
      <path id="selectedPrefPin" class="selected-pref-pin"/>
      <rect id="selectedPrefLabelBg" class="selected-pref-label-bg" rx="1.5"/>
      <text id="selectedPrefLabelText" class="selected-pref-label-text" dominant-baseline="middle"></text>
    </g>`;
    markup += `</svg>`;
    if(shapeCount === 0) return false;
    container.innerHTML = markup;
    container.querySelectorAll('.pref-shape').forEach(el=>{
      el.addEventListener('click', ()=>{
        const code = el.getAttribute('data-code');
        selectedPrefCode = (selectedPrefCode===code) ? null : code;
        paintMap();
        renderMapSide();
      });
    });
    return true;
  }



  function $(id){ return document.getElementById(id); }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function reiwaLabel(isoDate){
    if(!isoDate) return '';
    const parts = isoDate.split('-').map(Number);
    if(parts.length<3) return isoDate;
    const y = parts[0], m = parts[1], d = parts[2];
    return '令和' + (y-2018) + '年' + m + '月' + d + '日';
  }
  function matchPrefectureName(location){
    if(!location) return null;
    return PREFECTURE_NAMES.find(function(n){ return location.includes(n) || location.includes(n.slice(0,-1)); }) || null;
  }
  function shade(hex, percent){
    const num = parseInt(hex.replace('#',''),16);
    let r = (num>>16) + Math.round(255*percent/100);
    let g = ((num>>8)&0xff) + Math.round(255*percent/100);
    let b = (num&0xff) + Math.round(255*percent/100);
    r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
    return '#' + (r<<16|g<<8|b).toString(16).padStart(6,'0');
  }

  let DATA = null;
  let PHOTO_MAP = {};
  let selectedPrefCode = null;

  function openLightbox(src){ $('lightboxImg').src = src; $('lightbox').classList.add('show'); }
  function closeLightbox(){ $('lightbox').classList.remove('show'); $('lightboxImg').src=''; }
  $('lightbox').addEventListener('click', closeLightbox);

  function switchTab(tabId){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    document.querySelector('.tab-btn[data-tab="'+tabId+'"]').classList.add('active');
    $(tabId).classList.add('active');
    if(tabId === 'mapTab') renderMap();
  }
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ switchTab(btn.dataset.tab); });
  });

  // single delegated handler covers both interactions so only one ever
  // fires per click: the small expand button enlarges the cover photo,
  // clicking anywhere else on a book card jumps to its filtered records
  document.addEventListener('click', function(e){
    const expandBtn = e.target.closest('.book-expand');
    if(expandBtn){
      openLightbox(expandBtn.dataset.photo);
      return;
    }
    const card = e.target.closest('.book-card');
    if(card){
      switchTab('recordsTab');
      $('bookFilter').value = card.dataset.bookName;
      renderRecords();
      return;
    }
    const t = e.target.closest('[data-photo]');
    if(t && t.dataset.photo){ openLightbox(t.dataset.photo); return; }
  });

  function renderStats(){
    const s = DATA.stats || {};
    $('statsRow').innerHTML =
      '<div class="stat">' +
        '<div class="stat-label">御朱印總數（共 ' + (s.total||0) + ' 枚）</div>' +
        '<div class="stat-split">' +
          '<div class="stat-split-item"><span class="stat-split-value">' + (s.selfWritten||0) + '</span><span class="stat-split-label">親寫</span></div>' +
          '<div class="stat-split-divider"></div>' +
          '<div class="stat-split-item"><span class="stat-split-value">' + (s.proxyWritten||0) + '</span><span class="stat-split-label">代寫</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="stat">' +
        '<div class="stat-label">朱印帳數量（共 ' + (s.bookCount||0) + ' 本）</div>' +
        '<div class="stat-split">' +
          '<div class="stat-split-item"><span class="stat-split-value">' + (s.selfBookCount||0) + '</span><span class="stat-split-label">親領</span></div>' +
          '<div class="stat-split-divider"></div>' +
          '<div class="stat-split-item"><span class="stat-split-value">' + (s.proxyBookCount||0) + '</span><span class="stat-split-label">代購</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="stat"><div class="stat-label">參拜神社/寺廟數</div><div class="stat-value">' + (s.shrineCount||0) + '<small>間</small></div></div>' +
      '<div class="stat"><div class="stat-label">已巡禮都道府県</div><div class="stat-value">' + (s.visitedCount||0) + '<small>/ 47</small></div></div>';
    $('tabBookCount').textContent = DATA.books ? DATA.books.length : '';
    $('tabRecordCount').textContent = DATA.records ? DATA.records.length : '';
  }

  function renderBooks(){
    const books = (DATA.books || []).slice().sort(function(a,b){
      const ca = (DATA.records||[]).filter(function(r){ return r.bookName===a.name; }).length;
      const cb = (DATA.records||[]).filter(function(r){ return r.bookName===b.name; }).length;
      return cb - ca;
    });
    $('booksGrid').innerHTML = books.map(function(b){
      const photo = b.id ? PHOTO_MAP['book_'+b.id] : null;
      const count = (DATA.records||[]).filter(function(r){ return r.bookName===b.name; }).length;
      const bgStyle = photo
        ? ' style="background-image:url(' + photo + ');background-size:cover;background-position:center;"'
        : ' style="background:linear-gradient(160deg, ' + (b.color||'#2c4a6e') + ', ' + shade(b.color||'#2c4a6e', -18) + ');"';
      return '' +
      '<div class="book-card" data-book-name="' + escapeHtml(b.name) + '">' +
        (photo ? '<div class="book-cover has-photo"' + bgStyle + '></div><button class="book-expand" data-photo="' + photo + '" aria-label="放大封面">⤢</button>' : '<div class="book-cover"' + bgStyle + '></div>') +
        (b.mangan ? '<div class="mangan-badge">満願</div>' : '') +
        '<div class="book-title">' + escapeHtml(b.name) + '</div>' +
        '<div class="book-meta">' +
          '<div class="book-meta-col">' +
            '<span class="book-tag">' + escapeHtml(b.tag||'') + (b.proxyPurchased ? '（代購）' : '') + '</span>' +
            (b.location ? '<span class="book-location">' + escapeHtml(b.location) + '</span>' : '') +
          '</div>' +
          '<div class="book-meta-col right">' +
            '<span class="book-count">' + count + '<small>枚</small></span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('') || '<p class="empty-note">尚無朱印帳資料</p>';
  }

  function getFilteredRecords(){
    const q = ($('searchInput').value||'').trim().toLowerCase();
    const bookFilter = $('bookFilter').value;
    return (DATA.records||[]).filter(function(r){
      if(bookFilter!=='all' && r.bookName!==bookFilter) return false;
      if(q && !(String(r.name||'').toLowerCase().includes(q) || String(r.location||'').toLowerCase().includes(q))) return false;
      return true;
    }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  }
  function renderRecords(){
    const list = getFilteredRecords();
    $('recordsCount').textContent = '（共 ' + list.length + ' 筆）';
    $('recordsList').innerHTML = list.map(function(r){
      const photo = r.id ? PHOTO_MAP['rec_'+r.id] : null;
      return '' +
      '<div class="list-row' + (photo?' has-photo':'') + '"' + (photo?(' data-photo="'+photo+'"'):'') + '>' +
        '<div class="list-thumb' + (r.photoLandscape?' landscape':'') + '">' + (photo ? '<img src="'+photo+'" alt="" loading="lazy">' : '<span class="mini-mark">朱</span>') + '</div>' +
        '<div class="list-info">' +
          '<div class="list-name">' + escapeHtml(r.name||'（未命名）') + (r.proxyWritten ? '<span class="proxy-tag">代寫</span>' : '') + '</div>' +
          '<div class="list-meta">' +
            '<span>' + reiwaLabel(r.date) + '</span>' +
            (r.location ? '<span>' + escapeHtml(r.location) + '</span>' : '') +
            (r.bookName ? '<span>' + escapeHtml(r.bookName) + '</span>' : '') +
          '</div>' +
          ((r.tags&&r.tags.length) ? '<div class="list-tags">' + r.tags.map(function(t){ return '<span class="tag-pill">'+escapeHtml(t)+'</span>'; }).join('') + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('') || '<p class="empty-note">沒有符合條件的御朱印記錄</p>';
  }
  $('searchInput').addEventListener('input', renderRecords);
  $('bookFilter').addEventListener('change', renderRecords);

  let mapRendered = false;
  function renderTileMap(){
    const CELL = 24, GAP = 3;
    const maxCol = Math.max.apply(null, TILE_GRID.map(function(g){return g.col;}));
    const maxRow = Math.max.apply(null, TILE_GRID.map(function(g){return g.row;}));
    const W = (maxCol+1)*CELL + 8, H = (maxRow+1)*CELL + 8;
    let markup = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    TILE_GRID.forEach(function(g){
      const x = g.col*CELL+4, y = g.row*CELL+4, size = CELL-GAP;
      markup += '<g class="pref-tile" data-code="' + g.code + '">' +
        '<rect class="tile-base" x="' + x + '" y="' + y + '" width="' + size + '" height="' + size + '" rx="4"/>' +
        '<text class="tile-label" x="' + (x+size/2) + '" y="' + (y+size/2) + '">' + g.label + '</text>' +
      '</g>';
    });
    markup += '</svg>';
    $('japanMap').innerHTML = markup;
    $('japanMap').querySelectorAll('.pref-tile').forEach(function(el){
      el.addEventListener('click', function(){
        const code = el.getAttribute('data-code');
        selectedPrefCode = (selectedPrefCode===code) ? null : code;
        paintMap();
      });
    });
  }

  async function loadRealMap(){
    try{
      const results = await Promise.all([
        fetch('https://cdn.jsdelivr.net/gh/dataofjapan/land@master/japan.topojson'),
        import('https://cdn.jsdelivr.net/npm/topojson-client@3/+esm')
      ]);
      const topoRes = results[0], topojsonMod = results[1];
      if(!topoRes.ok) throw new Error('fetch failed: ' + topoRes.status);
      const topology = await topoRes.json();
      const objectKey = Object.keys(topology.objects)[0];
      const geojson = topojsonMod.feature(topology, topology.objects[objectKey]);
      const ok = renderRealMap(geojson);
      if(!ok) throw new Error('render produced no shapes');
      mapMode = 'real';
      $('mapCredit').innerHTML = '地圖資料：<a href="https://github.com/dataofjapan/land" target="_blank" rel="noopener">地球地図日本 / dataofjapan</a>';
      paintMap();
    }catch(e){
      mapMode = 'tile';
    }
  }

  function renderMap(){
    const visited = new Set(DATA.visitedPrefCodes || []);
    $('mapProgress').innerHTML = '已巡禮 <strong>' + visited.size + '</strong> / 47 都道府県';

    if(!mapRendered){
      mapRendered = true;
      renderTileMap();
      paintMap();
      loadRealMap();
      return;
    }
    paintMap();
  }

  function getPrefName(code){
    if(mapMode === 'real') return REAL_PREF_NAMES[code];
    const tile = TILE_GRID.find(function(g){ return g.code===code; });
    return tile ? tile.name : null;
  }

  function paintMap(){
    const visited = new Set(DATA.visitedPrefCodes || []);
    $('mapProgress').innerHTML = '已巡禮 <strong>' + visited.size + '</strong> / 47 都道府県';

    if(mapMode === 'real'){
      let selectedEl = null;
      $('japanMap').querySelectorAll('.pref-shape').forEach(function(el){
        const code = el.getAttribute('data-code');
        const isVisited = visited.has(code);
        const isSelected = code === selectedPrefCode;
        if(isSelected) selectedEl = el;
        const region = REGION_OF_CODE[code];
        const baseColor = PREFECTURE_COLOR_OVERRIDES[code] || REGION_COLORS[region] || '#8a7f6a';
        const baseOpacity = (code in PREFECTURE_OPACITY_OVERRIDES) ? PREFECTURE_OPACITY_OVERRIDES[code] : 0.78;
        el.style.fill = isVisited ? 'var(--shu)' : baseColor;
        el.style.fillOpacity = isVisited ? '1' : String(baseOpacity);
        el.style.stroke = 'var(--washi)';
        el.style.strokeWidth = '0.6';
        el.style.filter = isSelected
          ? 'drop-shadow(0 0 1.1px var(--sumi)) drop-shadow(0 0 1.1px var(--sumi)) brightness(1.15)'
          : 'none';
      });

      const svg = $('japanMap').querySelector('svg');
      const labelGroup = $('selectedPrefLabelGroup');
      if(selectedEl && svg && labelGroup){
        const name = selectedEl.getAttribute('data-name');
        const cx = parseFloat(selectedEl.getAttribute('data-cx'));
        const cy = parseFloat(selectedEl.getAttribute('data-cy'));
        const vb = svg.viewBox.baseVal;
        const fontSize = 6, padX = 2.4, padY = 1.8;
        const textEl = $('selectedPrefLabelText');
        const bgEl = $('selectedPrefLabelBg');
        const pinEl = $('selectedPrefPin');
        textEl.textContent = name;
        const estWidth = name.length * fontSize * 1.05;
        const boxW = estWidth + padX*2, boxH = fontSize + padY*2;
        const gap = 3;
        const rightX = cx + gap, leftX = cx - gap - boxW;
        const fitsRight = rightX + boxW <= vb.x + vb.width;
        const fitsLeft = leftX >= vb.x;
        const preferRight = cx >= vb.x + vb.width/2;
        let boxX;
        if(preferRight && fitsRight) boxX = rightX;
        else if(!preferRight && fitsLeft) boxX = leftX;
        else if(fitsRight) boxX = rightX;
        else if(fitsLeft) boxX = leftX;
        else boxX = Math.min(Math.max(cx - boxW/2, vb.x), vb.x + vb.width - boxW);
        let boxY = cy - boxH/2;
        boxY = Math.min(Math.max(boxY, vb.y), vb.y + vb.height - boxH);
        bgEl.setAttribute('x', boxX.toFixed(1));
        bgEl.setAttribute('y', boxY.toFixed(1));
        bgEl.setAttribute('width', boxW.toFixed(1));
        bgEl.setAttribute('height', boxH.toFixed(1));
        textEl.setAttribute('x', (boxX+padX).toFixed(1));
        textEl.setAttribute('y', (boxY+boxH/2).toFixed(1));
        const pinR = 1.6, topY = cy - pinR*3.4;
        const pinD = 'M'+cx.toFixed(1)+','+cy.toFixed(1)+' L'+(cx-pinR).toFixed(1)+','+(topY+pinR).toFixed(1)+' A'+pinR+','+pinR+' 0 1,1 '+(cx+pinR).toFixed(1)+','+(topY+pinR).toFixed(1)+' Z';
        pinEl.setAttribute('d', pinD);
        labelGroup.style.display = '';
      } else if(labelGroup){
        labelGroup.style.display = 'none';
      }
      renderMapSide();
      return;
    }

    $('japanMap').querySelectorAll('.pref-tile').forEach(function(el){
      const code = el.getAttribute('data-code');
      const isVisited = visited.has(code);
      const isSelected = code === selectedPrefCode;
      const rect = el.querySelector('.tile-base');
      rect.style.fill = isVisited ? 'var(--shu)' : '#c9c4ae';
      rect.style.fillOpacity = isVisited ? '1' : '0.55';
      el.classList.toggle('selected', isSelected);
      el.querySelector('.tile-label').style.fill = isVisited ? '#faf3e4' : '#2b2622';
    });
    renderMapSide();
  }
  function renderMapSide(){
    const side = $('mapSide');
    if(!selectedPrefCode){
      side.innerHTML = '<div class="map-side-empty">點選地圖上的色塊，查看該地的參拜記錄。</div>';
      return;
    }
    const prefName = getPrefName(selectedPrefCode);
    const list = (DATA.records||[]).filter(function(r){
      const m = matchPrefectureName(r.location);
      return m === prefName;
    }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

    side.innerHTML =
      '<div class="map-side-title">' + (prefName||'') + '</div>' +
      '<div class="map-side-count">共 ' + list.length + ' 枚御朱印</div>' +
      '<div class="map-side-list" id="mapSideList"></div>';
    const listWrap = $('mapSideList');
    if(list.length===0){
      listWrap.innerHTML = '<div class="empty-note">尚未在此地留下御朱印記錄</div>';
      return;
    }
    list.forEach(function(r){
      const photo = r.id ? PHOTO_MAP['rec_'+r.id] : null;
      const item = document.createElement('div');
      item.className = 'msi-item' + (photo ? ' has-photo' : '');
      if(photo) item.setAttribute('data-photo', photo);
      item.innerHTML =
        '<div class="msi-thumb">' + (photo ? '<img src="'+photo+'" alt="">' : '<span class="msi-thumb-mark">朱</span>') + '</div>' +
        '<div>' +
          '<div class="msi-name">' + escapeHtml(r.name||'（未命名）') + (r.proxyWritten ? '<span class="proxy-tag">代寫</span>' : '') + '</div>' +
          '<div class="msi-date">' + reiwaLabel(r.date) + '</div>' +
        '</div>';
      listWrap.appendChild(item);
    });
  }

  function render(data, photoMap){
    DATA = data;
    PHOTO_MAP = photoMap || {};
    $('stateBox').style.display = 'none';
    $('content').style.display = 'block';

    const bookNames = (data.books||[]).map(function(b){ return b.name; });
    $('bookFilter').innerHTML = '<option value="all">所有朱印帳</option>' +
      bookNames.map(function(n){ return '<option value="'+escapeHtml(n)+'">'+escapeHtml(n)+'</option>'; }).join('');

    renderStats();
    renderBooks();
    renderRecords();
  }

  function loadScript(src){
    return new Promise(function(resolve,reject){
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = function(){ reject(new Error('load failed: ' + src)); };
      document.head.appendChild(s);
    });
  }

  async function main(){
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if(!id){
      $('stateBox').textContent = '這個連結缺少分享 ID，請確認網址是否完整。';
      return;
    }
    if(!firebaseConfig.projectId || firebaseConfig.projectId.indexOf('PASTE_') === 0){
      $('stateBox').textContent = '這個分享頁面還沒有設定 Firebase，請聯絡連結提供者完成設定。';
      return;
    }
    try{
      await loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js');
      const app = firebase.initializeApp(firebaseConfig);
      const db = app.firestore();
      const shareRef = db.collection('goshuinShares').doc(id);
      const doc = await shareRef.get();
      if(!doc.exists){
        $('stateBox').textContent = '找不到這個分享內容，連結可能已失效。';
        return;
      }
      const photoMap = {};
      try{
        const photosSnap = await shareRef.collection('photos').get();
        photosSnap.forEach(function(p){ photoMap[p.id] = p.data().photo; });
      }catch(photoErr){
        console.error('photos failed to load', photoErr);
      }
      render(doc.data(), photoMap);
    }catch(e){
      console.error(e);
      $('stateBox').textContent = '載入失敗，請確認網路連線後重新整理頁面。';
    }
  }

  main();
</script>
